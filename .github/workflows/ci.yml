name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Unit Tests
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'ci-test-key' }}
          VITE_FIREBASE_AUTH_DOMAIN: 'mintrener.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'mintrener'
        run: npm test

      - name: TypeScript & Vite Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'ci-test-key' }}
          VITE_FIREBASE_AUTH_DOMAIN: 'mintrener.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'mintrener'
        run: npm run build

  # Sikkerhetstester for firestore.rules mot Firestore-emulatoren.
  # Trenger ingen hemmeligheter: demo-prosjekt-id kjører helt offline.
  rules-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Firestore-emulatoren krever Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run Firestore Rules Tests
        run: npm run test:rules
