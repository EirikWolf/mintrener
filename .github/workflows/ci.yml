name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Halevaktens integrasjonstest (scripts/__tests__/halevakt.integration.test.ts)
      # måler de committede bevisfilene med EKTE ffmpeg. Uten ffmpeg på PATH slår
      # `describe.skipIf` inn og kalibreringsvakten finnes bare på eierens maskin —
      # altså ikke der det teller. ubuntu-latest har ikke ffmpeg forhåndsinstallert.
      # Gjelder kun denne jobben; rules-tests og e2e-smoke kjører ikke lydtestene.
      - name: Install ffmpeg (halevaktens kalibreringstest)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Vitest Unit Tests
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'ci-test-key' }}
          VITE_FIREBASE_AUTH_DOMAIN: 'mintrener.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'mintrener'
        run: npm test

      - name: TypeScript & Vite Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'ci-test-key' }}
          VITE_FIREBASE_AUTH_DOMAIN: 'mintrener.firebaseapp.com'
          VITE_FIREBASE_PROJECT_ID: 'mintrener'
        run: npm run build

  # Sikkerhetstester for firestore.rules mot Firestore-emulatoren.
  # Trenger ingen hemmeligheter: demo-prosjekt-id kjører helt offline.
  rules-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Firestore-emulatoren krever Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Run Firestore Rules Tests
        run: npm run test:rules

  # B4 (revisjon § 5.3): én Playwright-røykflyt (start økt → fullfør → historikk)
  # mot vite preview av et emulator-rettet bygg (.env.e2e / --mode e2e).
  # Chromium only — dette er røyk, ikke kryssleser-matrise. Trenger ingen
  # hemmeligheter: demo-mintrener kjører helt offline mot Firestore-emulatoren.
  e2e-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Firestore-emulatoren krever Java (samme mønster som rules-tests)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Bygger med --mode e2e og kjører Playwright inne i emulators:exec
      - name: Run Playwright Smoke Flow
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
